<!DOCTYPE html>
<html id="htmlRoot">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تعديل PDF — PDF Suite</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/i18n.js"></script><script src="js/tools-data.js"></script><script src="js/icons.js"></script><script src="js/engine.js"></script>
<style>
#toolbar{position:sticky;top:57px;z-index:15;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
#toolbar button,#toolbar select,#toolbar input{font-size:14px;padding:8px 12px;border-radius:10px;border:1px solid #cbd5e1;background:#f8fafc;cursor:pointer}
#toolbar button.armed{background:#2563eb;color:#fff;border-color:#2563eb}
#toolbar button.primary{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;border:0;font-weight:700}
#pagebar{display:flex;gap:10px;align-items:center;justify-content:center;margin:10px 0;flex-wrap:wrap}
#stageScroll{overflow:auto;background:#334155;border-radius:14px;padding:20px;max-height:70vh}
#stage{position:relative;margin:0 auto;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#stage canvas{width:100%;height:auto;display:block}
#ovl{position:absolute;inset:0;overflow:hidden}
.el{position:absolute;cursor:move;touch-action:none}
.el.sel{outline:2px solid #2563eb;outline-offset:2px}
.txt{padding:2px 6px;white-space:pre-wrap;word-break:break-word;line-height:1.35;min-width:30px;min-height:20px}
.txt[contenteditable="true"]{cursor:text;background:#eff6ff}
.el img{width:100%;height:100%;display:block;pointer-events:none}
.el svg{width:100%;height:100%;display:block;pointer-events:none}
#signModal{position:fixed;inset:0;background:rgba(2,6,23,.6);display:none;place-items:center;z-index:50}
#signBox{background:#fff;border-radius:16px;padding:20px;width:min(560px,92vw)}
#signPad{border:2px dashed #93c5fd;border-radius:12px;width:100%;height:200px;touch-action:none;background:#fff}
.hint{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header class="nav"><div class="wrap">
<a class="logo" href="index.html">PDF<span>Suite</span></a>
<div class="navlinks"><a href="tools.html">← <span data-i="back">رجوع</span></a>
<button class="langbtn" onclick="setLang(getLang()==='ar'?'en':'ar')" id="langBtn">EN</button></div>
</div></header>
<div class="wrap"><section class="section" style="padding-top:18px">
<div id="head"></div>
<div class="drop" id="drop"><b data-i="dropTitle">اسحب الملفات هنا أو اضغط للاختيار</b><br><small>PDF — <span data-i="dropSub"></span></small>
<input type="file" id="file" accept=".pdf" hidden></div>
<div id="editor" style="display:none">
<div id="toolbar">
<button id="bText">✏️ <span data-t="addtext">نص</span></button>
<button id="bImg">🖼️ <span data-t="addimg">صورة</span></button>
<button id="bRect">▭ <span data-t="rect">مستطيل</span></button>
<button id="bEll">⬭ <span data-t="ell">دائرة</span></button>
<button id="bLine">📏 <span data-t="line">خط</span></button>
<button id="bSign">✍️ <span data-t="sign">توقيع</span></button>
<button id="bOcr">🔍 OCR</button>
<select id="oOcrLang" title="OCR language"><option value="eng+ara">عربي + EN</option><option value="eng">EN</option><option value="ara">عربي</option><option value="fra">FR</option><option value="spa">ES</option><option value="deu">DE</option><option value="ita">IT</option><option value="por">PT</option><option value="rus">RU</option><option value="nld">NL</option></select>
<label><span data-t="color">اللون</span> <input type="color" id="oColor" value="#1d4ed8"></label>
<label><span data-t="size">الحجم</span> <input type="number" id="oSize" value="18" min="8" max="120" style="width:64px"></label>
<button id="bBig">A+</button><button id="bSmall">A−</button>
<button id="bDel">🗑️ <span data-t="del">حذف</span></button>
<button id="bClear">🧹 <span data-t="clear">مسح الصفحة</span></button>
</div>
<div id="pagebar">
<button id="bPrev">◀</button><b id="pInfo">1 / 1</b><button id="bNext">▶</button>
<button id="bZout">−</button><span data-t="zoom">تكبير</span><button id="bZin">+</button>
<span class="hint" data-t="hint">اضغط الأداة ثم اضغط على الصفحة — اسحب العناصر لتحريكها — نقرة مزدوجة لتحرير النص</span>
</div>
<div id="stageScroll"><div id="stage"><canvas id="pdf"></canvas><div id="ovl"></div></div></div>
<div style="display:flex;gap:10px;margin:14px 0;flex-wrap:wrap">
<button class="btn" id="bSave">⬇️ <span data-t="save">تحميل PDF المعدّل</span></button>
<button class="btn ghost" id="bNew" data-t="new">ملف جديد</button>
</div>
<div class="result" id="res"></div>
</div>
</section></div>
<input type="file" id="imgFile" accept="image/*" hidden>
<div id="signModal"><div id="signBox">
<h3 data-t="sign">توقيع</h3>
<canvas id="signPad"></canvas>
<div style="display:flex;gap:8px;margin-top:10px">
<button class="btn" id="signOk">✅ <span data-t="use">استخدام</span></button>
<button class="btn ghost" id="signClr" data-t="clr">مسح</button>
<button class="btn ghost" id="signX" data-t="cancel">إلغاء</button>
</div></div></div>
<footer><div class="wrap"><span data-i="footerNote"></span></div></footer>
<script>
const L=getLang();document.getElementById('htmlRoot').lang=L;document.getElementById('htmlRoot').dir=I18N[L].dir;
document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T(e.dataset.i));
langBtn.textContent=I18N[L].langBtn;
const STR=L==='ar'?{addtext:'نص',addimg:'صورة',rect:'مستطيل',ell:'دائرة',line:'خط',sign:'توقيع',color:'اللون',size:'الحجم',del:'حذف',clear:'مسح الصفحة',zoom:'تكبير',hint:'اضغط الأداة ثم اضغط على الصفحة — اسحب العناصر لتحريكها — نقرة مزدوجة لتحرير النص',save:'تحميل PDF المعدّل',new:'ملف جديد',use:'استخدام',clr:'مسح',cancel:'إلغاء',newtext:'نص جديد',pick:'اختر ملف PDF أولا'}:{addtext:'Text',addimg:'Image',rect:'Rect',ell:'Ellipse',line:'Line',sign:'Sign',color:'Color',size:'Size',del:'Delete',clear:'Clear page',zoom:'Zoom',hint:'Pick a tool then click the page — drag items to move — double-click to edit text',save:'Download edited PDF',new:'New file',use:'Use',clr:'Clear',cancel:'Cancel',newtext:'New text',pick:'Choose a PDF first'};
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=STR[e.dataset.t]);
const slug=new URLSearchParams(location.search).get('tool')||'edit-pdf';
const tool=(window.TOOLS||[]).find(t=>t.t===slug)||{ar:'تعديل ملف PDF',en:'Edit PDF',arD:'إضافة نص وصور وتوقيع وأشكال',enD:'Add text, images, signature and shapes'};
document.title=(L==='ar'?tool.ar:tool.en)+' — PDF Suite';
head.innerHTML=`<span class="pill ok">⚡ ${T('working')}</span><h2>${L==='ar'?tool.ar:tool.en}</h2><p class="sub">${L==='ar'?tool.arD:tool.enD}</p>`;
/* ---------- state ---------- */
let srcBytes=null,fileName='edited.pdf',pdfJs=null,pageSizes=[],pageCount=0,cur=1,zoom=1;
let els={},sel=null,armed=null,uid=1;
let defColor='#1d4ed8',defSize=18,defStroke=3;
const stage=document.getElementById('stage'),ovl=document.getElementById('ovl'),canvas=document.getElementById('pdf');
/* ---------- open ---------- */
const drop=document.getElementById('drop'),fi=document.getElementById('file');
drop.onclick=()=>fi.click();
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over')});
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');if(e.dataTransfer.files[0])openFile(e.dataTransfer.files[0])});
fi.onchange=()=>{if(fi.files[0])openFile(fi.files[0])};
async function openFile(f){
 fileName=f.name.replace(/\.pdf$/i,'')+'-edited.pdf';
 srcBytes=new Uint8Array(await f.arrayBuffer());
 await ensurePdfJs();await ensurePdfLib();
 pdfJs=await window.pdfjsLib.getDocument({data:srcBytes.slice()}).promise;
 const lib=await window.PDFLib.PDFDocument.load(srcBytes);
 pageCount=pdfJs.numPages;pageSizes=[];
 for(let i=0;i<pageCount;i++){const s=lib.getPage(i).getSize();pageSizes.push(s)}
 els={};sel=null;cur=1;zoom=1;
 drop.style.display='none';document.getElementById('editor').style.display='block';
 render();
}
/* ---------- render page ---------- */
async function render(){
 const page=await pdfJs.getPage(cur);
 const vp=page.getViewport({scale:2});
 canvas.width=vp.width;canvas.height=vp.height;
 await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
 const base=Math.min(document.getElementById('stageScroll').clientWidth-40,900);
 stage.style.width=(base*zoom)+'px';
 document.getElementById('pInfo').textContent=cur+' / '+pageCount;
 ovl.innerHTML='';
 (els[cur]||[]).forEach(el=>ovl.appendChild(elNode(el)));
}
function elNode(el){
 let n;
 const W=stage.clientWidth;
 if(el.type==='text'){
  n=document.createElement('div');n.className='el txt'+(sel===el.id?' sel':'');
  n.style.left=(el.x*100)+'%';n.style.top=(el.y*100)+'%';n.style.width=(el.w*100)+'%';
  n.style.color=el.color;n.style.fontSize=(el.fontPt*(W/pageSizes[cur-1].width))+'px';
  if(el.bg)n.style.background=el.bg;
  if(el.bold)n.style.fontWeight='bold';
  n.textContent=el.text;
  n.ondblclick=e=>{e.stopPropagation();n.contentEditable='true';n.focus();document.execCommand&&document.execCommand('selectAll',false,null)};
  n.onblur=()=>{n.contentEditable='false';el.text=n.textContent};
 }else if(el.type==='image'){
  n=document.createElement('div');n.className='el'+(sel===el.id?' sel':'');
  n.style.left=(el.x*100)+'%';n.style.top=(el.y*100)+'%';n.style.width=(el.w*100)+'%';n.style.height=(el.h*100)+'%';
  const im=document.createElement('img');im.src=el.img;im.draggable=false;n.appendChild(im);
 }else{
  n=document.createElement('div');n.className='el'+(sel===el.id?' sel':'');
  n.style.left=(el.x*100)+'%';n.style.top=(el.y*100)+'%';n.style.width=(el.w*100)+'%';n.style.height=(el.h*100)+'%';
  const NS='http://www.w3.org/2000/svg',svg=document.createElementNS(NS,'svg');
  svg.setAttribute('preserveAspectRatio','none');svg.setAttribute('viewBox','0 0 100 100');
  let sh;
  if(el.type==='rect'){sh=document.createElementNS(NS,'rect');sh.setAttribute('x',3);sh.setAttribute('y',3);sh.setAttribute('width',94);sh.setAttribute('height',94);sh.setAttribute('fill','none')}
  else if(el.type==='ellipse'){sh=document.createElementNS(NS,'ellipse');sh.setAttribute('cx',50);sh.setAttribute('cy',50);sh.setAttribute('rx',47);sh.setAttribute('cy',50);sh.setAttribute('ry',47);sh.setAttribute('fill','none')}
  else{sh=document.createElementNS(NS,'line');sh.setAttribute('x1',2);sh.setAttribute('y1',98);sh.setAttribute('x2',98);sh.setAttribute('y2',2)}
  sh.setAttribute('stroke',el.color);sh.setAttribute('stroke-width',el.stroke*2);
  svg.appendChild(sh);n.appendChild(svg);
 }
 n.dataset.id=el.id;
 n.onpointerdown=e=>startDrag(e,el,n);
 n.onclick=e=>{e.stopPropagation();sel=el.id;syncSel()};
 return n;
}
function syncSel(){ovl.querySelectorAll('.el').forEach(x=>x.classList.toggle('sel',+x.dataset.id===sel))}
/* ---------- drag & place ---------- */
function frac(e){const r=stage.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
function startDrag(e,el,node){
 if(armed||e.target.contentEditable==='true')return;
 e.preventDefault();sel=el.id;syncSel();
 node.setPointerCapture(e.pointerId);
 const r0=frac(e),ox=el.x,oy=el.y;
 const mv=ev=>{const r=frac(ev);el.x=Math.min(.95,Math.max(0,ox+r.x-r0.x));el.y=Math.min(.95,Math.max(0,oy+r.y-r0.y));
  node.style.left=(el.x*100)+'%';node.style.top=(el.y*100)+'%'};
 const up=()=>{node.removeEventListener('pointermove',mv);node.removeEventListener('pointerup',up)};
 node.addEventListener('pointermove',mv);node.addEventListener('pointerup',up);
}
stage.addEventListener('click',e=>{
 if(!armed)return;
 const p=frac(e);
 if(armed==='text')addEl({id:uid++,type:'text',x:Math.max(0,p.x-.2),y:Math.max(0,p.y-.03),w:.4,text:STR.newtext,color:defColor,fontPt:defSize,bold:false});
 else if(armed==='rect'||armed==='ellipse'||armed==='line')addEl({id:uid++,type:armed,x:Math.max(0,p.x-.1),y:Math.max(0,p.y-.05),w:.2,h:.1,color:defColor,stroke:defStroke});
 disarm();render();
});
function addEl(el){(els[cur]=els[cur]||[]).push(el);sel=el.id}
/* ---------- toolbar ---------- */
function arm(t,btn){armed=(armed===t?null:t);
 document.querySelectorAll('#toolbar button').forEach(b=>b.classList.remove('armed'));
 if(armed)btn.classList.add('armed')}
function disarm(){armed=null;document.querySelectorAll('#toolbar button').forEach(b=>b.classList.remove('armed'))}
bText.onclick=e=>arm('text',e.currentTarget);
bRect.onclick=e=>arm('rect',e.currentTarget);
bEll.onclick=e=>arm('ellipse',e.currentTarget);
bLine.onclick=e=>arm('line',e.currentTarget);
bImg.onclick=()=>document.getElementById('imgFile').click();
document.getElementById('imgFile').onchange=e=>{
 const f=e.target.files[0];if(!f)return;
 const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{
  const a=im.naturalHeight/Math.max(1,im.naturalWidth),w=.3;
  addEl({id:uid++,type:'image',x:.35,y:.4,w,h:w*(pageSizes[cur-1].width/pageSizes[cur-1].height)*a,img:rd.result});render()};im.src=rd.result};
 rd.readAsDataURL(f);e.target.value='';
};
oColor.oninput=()=>{defColor=oColor.value;const el=findSel();if(el&&(el.type==='text'||el.type==='rect'||el.type==='ellipse'||el.type==='line')){el.color=defColor;render()}};
oSize.oninput=()=>{defSize=+oSize.value||18;const el=findSel();if(el&&el.type==='text'){el.fontPt=defSize;render()}};
function findSel(){return (els[cur]||[]).find(x=>x.id===sel)}
bBig.onclick=()=>growSel(1.15);bSmall.onclick=()=>growSel(1/1.15);
function growSel(k){const el=findSel();if(!el)return;if(el.type==='text')el.fontPt=Math.min(120,Math.max(6,el.fontPt*k));else{el.w=Math.min(1,el.w*k);if(el.h)el.h=Math.min(1,el.h*k)}render()}
bDel.onclick=()=>{els[cur]=(els[cur]||[]).filter(x=>x.id!==sel);sel=null;render()};
bClear.onclick=()=>{els[cur]=[];sel=null;render()};
bPrev.onclick=()=>{if(cur>1){cur--;sel=null;render()}};
bNext.onclick=()=>{if(cur<pageCount){cur++;sel=null;render()}};
bZin.onclick=()=>{zoom=Math.min(3,zoom+.25);render()};
bZout.onclick=()=>{zoom=Math.max(.5,zoom-.25);render()};
bNew.onclick=()=>{document.getElementById('editor').style.display='none';drop.style.display='block';srcBytes=null};
/* ---------- signature ---------- */
const modal=document.getElementById('signModal'),pad=document.getElementById('signPad'),pctx=pad.getContext('2d');
bSign.onclick=()=>{modal.style.display='grid';sizePad()};
function sizePad(){pad.width=pad.clientWidth*2||1000;pad.height=400;pctx.lineWidth=5;pctx.lineCap='round';pctx.strokeStyle='#111'}
let drawing=false,lx=0,ly=0;
function pos(e){const r=pad.getBoundingClientRect();return[(e.clientX-r.left)/r.width*pad.width,(e.clientY-r.top)/r.height*pad.height]}
pad.onpointerdown=e=>{drawing=true;[lx,ly]=pos(e);pad.setPointerCapture(e.pointerId)};
pad.onpointermove=e=>{if(!drawing)return;const[a,b]=pos(e);pctx.beginPath();pctx.moveTo(lx,ly);pctx.lineTo(a,b);pctx.stroke();lx=a;ly=b};
pad.onpointerup=()=>drawing=false;
signClr.onclick=sizePad;signX.onclick=()=>modal.style.display='none';
signOk.onclick=()=>{
 const url=pad.toDataURL('image/png');modal.style.display='none';sizePad();
 addEl({id:uid++,type:'image',x:.3,y:.42,w:.4,h:.4*(pageSizes[cur-1].width/pageSizes[cur-1].height)*.4,img:url});render();
};
/* ---------- OCR: scanned lines -> editable text ---------- */
bOcr.onclick=async()=>{
 if(!srcBytes)return alert(STR.pick);
 const btn=bOcr;btn.disabled=true;
 const lang=document.getElementById('oOcrLang').value||'eng+ara';
 const step=s=>{res.innerHTML='⏳ '+esc(s)};
 try{
  step(L==='ar'?'1/3 تحميل مكتبة OCR…':'1/3 Loading OCR engine…');
  const T=await ensureLib('Tesseract','https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  if(!T||!T.recognize)throw new Error('OCR engine failed to load — check internet connection');
  step(L==='ar'?'2/3 عرض الصفحة بدقة عالية…':'2/3 Rendering page…');
  const page=await pdfJs.getPage(cur);
  const sc=3,vp=page.getViewport({scale:sc});
  const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
  const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:cx,viewport:vp}).promise;
  step(L==='ar'?'3/3 التعرف على النص (أول مرة قد تستغرق دقيقة لتحميل بيانات اللغة)…':'3/3 Recognizing (first run downloads language data)…');
  const r=await T.recognize(c,lang,{logger:m=>{
   if(m&&(m.status==='recognizing text')&&typeof m.progress==='number')step((L==='ar'?'التعرف ':'Recognizing ')+Math.round(m.progress*100)+'%');
  }});
  const data=(r&&r.data)||{};
  const lines=data.lines||[];
  const ptW=pageSizes[cur-1].width,k=c.width/ptW;
  let added=0;
  const put=(t,x0,y0,x1,y1)=>{
   t=String(t||'').trim();if(!t)return;
   const hPt=(y1-y0)/k;if(!(hPt>3))return;
   addEl({id:uid++,type:'text',x:Math.max(0,x0/c.width),y:Math.max(0,y0/c.height),w:Math.min(1,Math.max(.05,(x1-x0)/c.width)),
    text:t,color:'#111111',fontPt:Math.min(72,Math.max(6,hPt*0.72)),bold:false,bg:'#ffffff'});
   added++;
  };
  lines.forEach(Ln=>{if(Ln&&Ln.bbox)put(Ln.text,Ln.bbox.x0,Ln.bbox.y0,Ln.bbox.x1,Ln.bbox.y1)});
  if(!added&&(data.text||'').trim())put(data.text,10,10,c.width-10,10+Math.round(24*k));
  if(!added){res.innerHTML=L==='ar'?'⚠️ لم يتم العثور على نص — جرّب لغة أخرى أو صفحة أوضح':'⚠️ No text found — try another language or a clearer page';return}
  res.innerHTML='✅ '+added+(L==='ar'?' سطرا قابلا للتحرير — نقرة مزدوجة على أي سطر لتعديله ثم حمّل PDF':' editable lines — double-click any line to edit, then download');
  render();
 }catch(e){console.error(e);res.innerHTML='❌ '+esc(e&&e.message||e)+(L==='ar'?'<br><small>تأكد من الاتصال بالإنترنت (المكتبة وبيانات اللغة تُحمَّل من CDN) ثم أعد المحاولة</small>':'<br><small>Check internet (engine + language data load from CDN) and retry</small>')}
 finally{btn.disabled=false}
};
/* ---------- export ---------- */
function hexRgb(h){h=h.replace('#','');return{w:(parseInt(h.slice(0,2),16)/255),g:(parseInt(h.slice(2,4),16)/255),b:(parseInt(h.slice(4,6),16)/255)}}
bSave.onclick=async()=>{
 if(!srcBytes)return alert(STR.pick);
 res.innerHTML='⏳ …';
 try{
  const {PDFDocument,rgb}=window.PDFLib;
  const doc=await PDFDocument.load(srcBytes);
  const n=doc.getPageCount();
  for(let i=0;i<n;i++){
   const pg=doc.getPage(i),{width:W,height:H}=pg.getSize();
   for(const el of (els[i+1]||[])){
    if(el.type==='text'){
     const scale=3,bw=Math.max(10,el.w*W*scale),fs=el.fontPt*scale,lh=fs*1.3;
     const mc=document.createElement('canvas').getContext('2d');
     mc.font=(el.bold?'bold ':'')+Math.round(fs)+'px "Segoe UI",Tahoma,Arial';
     const words=String(el.text||'').split(/\s+/),lines=[];let line='';
     words.forEach(w=>{const t=line?line+' '+w:w;if(mc.measureText(t).width>bw&&line){lines.push(line);line=w}else line=t});
     if(line)lines.push(line);
     const cv=document.createElement('canvas');cv.width=Math.ceil(bw);cv.height=Math.ceil(lines.length*lh+8);
     const c2=cv.getContext('2d');c2.font=mc.font;c2.textBaseline='top';
     if(el.bg){c2.fillStyle=el.bg;c2.fillRect(0,0,cv.width,cv.height)}
     c2.fillStyle=el.color;
     lines.forEach((t,j)=>c2.fillText(t,2,4+j*lh));
     const png=await doc.embedPng(cv.toDataURL('image/png'));
     const bh=cv.height/scale;
     pg.drawImage(png,{x:el.x*W,y:H-el.y*H-bh,width:el.w*W,height:bh});
    }else if(el.type==='image'){
     const u=el.img;
     const img=u.startsWith('data:image/jpeg')||u.startsWith('data:image/jpg')?await doc.embedJpg(u):await doc.embedPng(u);
     pg.drawImage(img,{x:el.x*W,y:H-el.y*H-el.h*H,width:el.w*W,height:el.h*H});
    }else{
     const c=hexRgb(el.color),X=el.x*W,Y=H-el.y*H-el.h*H,Wd=el.w*W,Ht=el.h*H;
     if(el.type==='rect')pg.drawRectangle({x:X,y:Y,width:Wd,height:Ht,borderColor:rgb(c.w,c.g,c.b),borderWidth:el.stroke});
     else if(el.type==='ellipse')pg.drawEllipse({x:X+Wd/2,y:Y+Ht/2,xScale:Wd/2,yScale:Ht/2,borderColor:rgb(c.w,c.g,c.b),borderWidth:el.stroke});
     else pg.drawLine({start:{x:X,y:H-el.y*H},end:{x:X+Wd,y:Y},thickness:el.stroke,color:rgb(c.w,c.g,c.b)});
    }
   }
  }
  const out=await doc.save({useObjectStreams:true});
  const blob=new Blob([out],{type:'application/pdf'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fileName;document.body.appendChild(a);a.click();a.remove();
  res.innerHTML=`✅ <a class="btn" href="${a.href}" download="${fileName}">${T('download')}</a>`;
 }catch(e){console.error(e);res.innerHTML='❌ '+(e.message||e)}
};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
</script>
